name: Aggiorna feed AB Medical
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5,11,17,23 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scarica e decomprimi XML
        run: |
          python3 scripts/update_feed.py
      - name: Pubblica solo se cambiato
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/catalogo.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiornamento catalogo XML'
            git push
          fi
